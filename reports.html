<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Action Plumbing</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="p-4 max-w-7xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-3xl font-bold text-blue-900">📊 Performance Reports</h1>
            <a href="index.html" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 font-semibold">← Back to Dashboard</a>
        </div>

        <div id="personName" class="mb-4 text-xl font-bold text-gray-700"></div>

        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <h2 class="text-2xl font-bold mb-4 text-blue-900">📊 Monthly Performance Metrics</h2>
            <div id="monthlyMetrics" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </div>

        <div class="bg-gradient-to-br from-green-50 to-emerald-50 p-6 rounded-lg shadow-lg border-2 border-green-400">
            <h2 class="text-2xl font-bold mb-4 text-green-900">🏅 Monthly Leaderboard</h2>
            <div id="leaderboard" class="space-y-3"></div>
        </div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyD9POKxbl9hSt2FNtzdv3RPVnAb0wWsNbU",
            databaseURL: "https://action-sales-tracker-default-rtdb.firebaseio.com",
            projectId: "action-sales-tracker"
        });

        const db = firebase.database();
        const selectedPerson = localStorage.getItem('selectedPerson');
        if (!selectedPerson) {
            window.location.href = 'index.html';
        }

        let personName = '';
        let allLogs = {};
        let allPeople = [];
        let monthlyGoals = {};

        db.ref(`salespeople/${selectedPerson}`).once('value', s => {
            personName = s.val()?.name || 'Unknown';
            document.getElementById('personName').textContent = `Performance Report for: ${personName}`;
        });

        db.ref('salespeople').on('value', s => {
            const data = s.val();
            allPeople = data ? Object.keys(data).map(k => ({ id: k, name: data[k].name })) : [];
            renderLeaderboard();
        });

        db.ref('callLogs').on('value', s => {
            allLogs = s.val() || {};
            renderMetrics();
            renderLeaderboard();
        });

        db.ref('monthlyGoals').on('value', s => {
            monthlyGoals = s.val() || {};
            renderLeaderboard();
        });

        function getMonthDates() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const dates = [];
            const lastDay = new Date(year, month + 1, 0).getDate();
            for (let day = 1; day <= lastDay; day++) {
                dates.push(new Date(year, month, day));
            }
            return dates;
        }

        function getDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        }

        function calculateTotals(personId) {
            const totals = {
                totalCalls: 0, callsSold: 0, amountSold: 0, moneyOwed: 0,
                selfGenLeads: 0, reviewsCompleted: 0, turnoversAttempted: 0,
                turnoversAccepted: 0, rillaCompliant: 0, restorationLeads: 0,
                plansSold: 0, upsellsCompleted: 0, estimatesLeft: 0
            };

            getMonthDates().forEach(date => {
                const key = `${personId}_${getDateKey(date)}`;
                const calls = allLogs[key];
                if (calls) {
                    Object.values(calls).forEach(c => {
                        totals.totalCalls++;
                        if (c.jobSold) {
                            totals.callsSold++;
                            totals.amountSold += parseFloat(c.amountSold) || 0;
                        }
                        totals.moneyOwed += parseFloat(c.moneyOwed) || 0;
                        if (c.selfGeneratedLead) totals.selfGenLeads++;
                        if (c.reviewCompleted) totals.reviewsCompleted++;
                        if (c.turnoverAttempted) totals.turnoversAttempted++;
                        if (c.turnoverAccepted) totals.turnoversAccepted++;
                        if (c.rillaCompliant) totals.rillaCompliant++;
                        if (c.restorationLead) totals.restorationLeads++;
                        if (c.maintenancePlanSold) totals.plansSold++;
                        if (c.upsellCompleted) totals.upsellsCompleted++;
                        if (c.leftEstimate) totals.estimatesLeft++;
                    });
                }
            });

            return totals;
        }

        function renderMetrics() {
            const totals = calculateTotals(selectedPerson);
            const closeRate = totals.totalCalls > 0 ? ((totals.callsSold / totals.totalCalls) * 100).toFixed(1) : 0;
            const callAvg = totals.callsSold > 0 ? (totals.amountSold / totals.callsSold).toFixed(0) : 0;
            const reviewRate = totals.totalCalls > 0 ? ((totals.reviewsCompleted / totals.totalCalls) * 100).toFixed(1) : 0;
            const turnoverRate = totals.turnoversAttempted > 0 ? ((totals.turnoversAccepted / totals.turnoversAttempted) * 100).toFixed(1) : 0;
            const rillaRate = totals.totalCalls > 0 ? ((totals.rillaCompliant / totals.totalCalls) * 100).toFixed(1) : 0;
            const membershipRate = totals.callsSold > 0 ? ((totals.plansSold / totals.callsSold) * 100).toFixed(1) : 0;
            const upsellRate = totals.callsSold > 0 ? ((totals.upsellsCompleted / totals.callsSold) * 100).toFixed(1) : 0;

            document.getElementById('monthlyMetrics').innerHTML = `
                <div class="p-4 bg-blue-50 rounded-lg border-2 border-blue-300">
                    <p class="text-sm font-bold text-blue-700">Closing Rate</p>
                    <p class="text-3xl font-bold text-blue-900">${closeRate}%</p>
                    <p class="text-xs text-gray-600">${totals.callsSold} / ${totals.totalCalls} calls</p>
                </div>
                <div class="p-4 bg-green-50 rounded-lg border-2 border-green-300">
                    <p class="text-sm font-bold text-green-700">Call Average</p>
                    <p class="text-3xl font-bold text-green-900">$${callAvg}</p>
                    <p class="text-xs text-gray-600">per sale</p>
                </div>
                <div class="p-4 bg-purple-50 rounded-lg border-2 border-purple-300">
                    <p class="text-sm font-bold text-purple-700">Review Rate</p>
                    <p class="text-3xl font-bold text-purple-900">${reviewRate}%</p>
                    <p class="text-xs text-gray-600">${totals.reviewsCompleted} reviews</p>
                </div>
                <div class="p-4 bg-orange-50 rounded-lg border-2 border-orange-300">
                    <p class="text-sm font-bold text-orange-700">Turnover Rate</p>
                    <p class="text-3xl font-bold text-orange-900">${turnoverRate}%</p>
                    <p class="text-xs text-gray-600">${totals.turnoversAccepted} / ${totals.turnoversAttempted}</p>
                </div>
                <div class="p-4 bg-indigo-50 rounded-lg border-2 border-indigo-300">
                    <p class="text-sm font-bold text-indigo-700">Rilla Compliance</p>
                    <p class="text-3xl font-bold text-indigo-900">${rillaRate}%</p>
                    <p class="text-xs text-gray-600">${totals.rillaCompliant} compliant</p>
                </div>
                <div class="p-4 bg-pink-50 rounded-lg border-2 border-pink-300">
                    <p class="text-sm font-bold text-pink-700">Restoration Leads</p>
                    <p class="text-3xl font-bold text-pink-900">${totals.restorationLeads}</p>
                    <p class="text-xs text-gray-600">this month</p>
                </div>
                <div class="p-4 bg-yellow-50 rounded-lg border-2 border-yellow-300">
                    <p class="text-sm font-bold text-yellow-700">Plans Sold</p>
                    <p class="text-3xl font-bold text-yellow-900">${totals.plansSold}</p>
                    <p class="text-xs text-gray-600">maintenance</p>
                </div>
                <div class="p-4 bg-teal-50 rounded-lg border-2 border-teal-300">
                    <p class="text-sm font-bold text-teal-700">Membership Rate</p>
                    <p class="text-3xl font-bold text-teal-900">${membershipRate}%</p>
                    <p class="text-xs text-gray-600">of sales</p>
                </div>
                <div class="p-4 bg-red-50 rounded-lg border-2 border-red-300">
                    <p class="text-sm font-bold text-red-700">Upsell Rate</p>
                    <p class="text-3xl font-bold text-red-900">${upsellRate}%</p>
                    <p class="text-xs text-gray-600">${totals.upsellsCompleted} upsells</p>
                </div>
                <div class="p-4 bg-cyan-50 rounded-lg border-2 border-cyan-300 col-span-2">
                    <p class="text-sm font-bold text-cyan-700">Total Revenue</p>
                    <p class="text-4xl font-bold text-cyan-900">$${totals.amountSold.toLocaleString()}</p>
                    <p class="text-xs text-gray-600">${totals.callsSold} sales this month</p>
                </div>
                <div class="p-4 bg-orange-50 rounded-lg border-2 border-orange-300">
                    <p class="text-sm font-bold text-orange-700">Estimates Left</p>
                    <p class="text-3xl font-bold text-orange-900">${totals.estimatesLeft}</p>
                    <p class="text-xs text-gray-600">follow up needed</p>
                </div>
            `;
        }

        function renderLeaderboard() {
            const stats = allPeople.map(p => {
                const totals = calculateTotals(p.id);
                return { ...p, ...totals };
            }).sort((a, b) => b.amountSold - a.amountSold);

            const medals = ['🥇', '🥈', '🥉'];
            const titles = ['👑 Month Leader', '⭐ Runner Up', '🎯 Bronze'];
            const now = new Date();
            const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

            document.getElementById('leaderboard').innerHTML = stats.map((p, i) => {
                const closeRate = p.totalCalls > 0 ? (p.callsSold / p.totalCalls) * 100 : 0;
                const goalKey = `${p.id}_${monthKey}`;
                const goal = monthlyGoals[goalKey] || 0;
                const goalProgress = goal > 0 ? (p.amountSold / goal) * 100 : 0;

                const bgClass = i === 0 ? 'bg-green-100 border-green-400' :
                               i === 1 ? 'bg-gray-100 border-gray-400' :
                               i === 2 ? 'bg-orange-100 border-orange-400' :
                               'bg-white border-gray-300';

                return `
                    <div class="p-4 rounded-lg border-2 ${bgClass}">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">${i < 3 ? medals[i] : `#${i+1}`}</span>
                                <div>
                                    <p class="font-bold text-lg">${p.name}</p>
                                    ${i < 3 ? `<p class="text-xs text-gray-600">${titles[i]}</p>` : ''}
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm text-gray-600">Month Total</p>
                                <p class="font-bold text-xl">$${p.amountSold.toLocaleString()}</p>
                                <p class="text-xs text-gray-600">${p.callsSold} sales • ${closeRate.toFixed(1)}% close</p>
                            </div>
                        </div>
                        ${goal > 0 ? `
                            <div class="mt-2">
                                <div class="flex justify-between text-xs mb-1">
                                    <span>Goal:</span>
                                    <span class="font-bold">${goalProgress.toFixed(0)}% of $${goal.toLocaleString()}</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="h-full rounded-full ${goalProgress >= 100 ? 'bg-green-600' : goalProgress >= 50 ? 'bg-yellow-500' : 'bg-red-500'}" style="width: ${Math.min(goalProgress, 100)}%"></div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        renderMetrics();
    </script>
</body>
</html>
