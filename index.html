                                       <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Plumbing Sales Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [salespeople, setSalespeople] = useState([]);
            const [newName, setNewName] = useState('');

            useEffect(() => {
                const saved = localStorage.getItem('salespeople');
                if (saved) setSalespeople(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('salespeople', JSON.stringify(salespeople));
            }, [salespeople]);

            const addPerson = () => {
                if (newName.trim()) {
                    setSalespeople([...salespeople, { id: Date.now(), name: newName.trim() }]);
                    setNewName('');
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 p-8">
                    <div className="max-w-4xl mx-auto">
                        <h1 className="text-3xl font-bold mb-6">Action Plumbing Sales Tracker</h1>
                        
                        <div className="bg-white p-6 rounded-lg shadow mb-6">
                            <h2 className="text-xl font-semibold mb-4">Add Salesperson</h2>
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={newName}
                                    onChange={(e) => setNewName(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && addPerson()}
                                    placeholder="Enter name"
                                    className="flex-1 px-4 py-2 border rounded"
                                />
                                <button
                                    onClick={addPerson}
                                    className="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
                                >
                                    Add
                                </button>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-lg shadow">
                            <h2 className="text-xl font-semibold mb-4">Team Members</h2>
                            {salespeople.length === 0 ? (
                                <p className="text-gray-500">No salespeople added yet</p>
                            ) : (
                                <ul className="space-y-2">
                                    {salespeople.map(person => (
                                        <li key={person.id} className="p-3 bg-blue-50 rounded">
                                            {person.name}
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
