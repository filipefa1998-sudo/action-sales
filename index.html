<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Plumbing Sales Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        firebase.initializeApp({
            apiKey: "AIzaSyD9POKxbl9hSt2FNtzdv3RPVnAb0wWsNbU",
            authDomain: "action-sales-tracker.firebaseapp.com",
            databaseURL: "https://action-sales-tracker-default-rtdb.firebaseio.com",
            projectId: "action-sales-tracker",
            storageBucket: "action-sales-tracker.firebasestorage.app",
            messagingSenderId: "686455834332",
            appId: "1:686455834332:web:84e9b843f912522bbdd619"
        });

        const db = firebase.database();
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [people, setPeople] = useState([]);
            const [selected, setSelected] = useState(null);
            const [date, setDate] = useState(new Date());
            const [logs, setLogs] = useState({});
            const [selDate, setSelDate] = useState(null);
            const [newName, setNewName] = useState('');
            const [showAdd, setShowAdd] = useState(false);
            const [mGoals, setMGoals] = useState({});
            const [yGoals, setYGoals] = useState({});
            const [tmGoal, setTmGoal] = useState(0);
            const [tyGoal, setTyGoal] = useState(0);
            const [comm, setComm] = useState(0);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                db.ref('salespeople').on('value', s => {
                    const d = s.val();
                    if (d) {
                        const arr = Object.keys(d).map(k => ({ id: k, name: d[k].name }));
                        setPeople(arr);
                        if (!selected && arr.length) setSelected(arr[0].id);
                    }
                    setLoading(false);
                });
                db.ref('callLogs').on('value', s => setLogs(s.val() || {}));
                db.ref('monthlyGoals').on('value', s => setMGoals(s.val() || {}));
                db.ref('yearlyGoals').on('value', s => setYGoals(s.val() || {}));
                db.ref('teamMonthlyGoal').on('value', s => setTmGoal(s.val() || 0));
                db.ref('teamYearlyGoal').on('value', s => setTyGoal(s.val() || 0));
                db.ref('commissionRate').on('value', s => setComm(s.val() || 0));
                return () => {
                    db.ref('salespeople').off();
                    db.ref('callLogs').off();
                    db.ref('monthlyGoals').off();
                    db.ref('yearlyGoals').off();
                    db.ref('teamMonthlyGoal').off();
                    db.ref('teamYearlyGoal').off();
                    db.ref('commissionRate').off();
                };
            }, []);

            const getWeek = d => {
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                const mon = new Date(d);
                mon.setDate(diff);
                const w = [];
                for (let i = 0; i < 7; i++) {
                    const nd = new Date(mon);
                    nd.setDate(mon.getDate() + i);
                    w.push(nd);
                }
                return w;
            };

            const dk = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const dataKey = (pid, d) => `${pid}_${dk(d)}`;
            const mk = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
            const yk = d => `${d.getFullYear()}`;
            
            const week = useMemo(() => getWeek(date), [date]);

            const addP = () => {
                if (newName.trim()) {
                    db.ref('salespeople').push().set({ name: newName.trim() });
                    setNewName('');
                    setShowAdd(false);
                }
            };

            const removeP = id => {
                const p = people.find(x => x.id === id);
                if (confirm(`Remove ${p.name}?`)) {
                    db.ref(`salespeople/${id}`).remove();
                    if (selected === id) setSelected(null);
                }
            };

            const addCall = (pid, d) => {
                const k = dataKey(pid, d);
                db.ref(`callLogs/${k}`).push().set({
                    customerName: '', jobNumber: '', customerPhone: '',
                    reviewCompleted: false, restorationLead: false,
                    turnoverAttempted: false, turnoverAccepted: false,
                    selfGeneratedLead: false, rillaCompliant: false,
                    maintenancePlanSold: false, upsellCompleted: false,
                    upsellAmount: 0, jobComplete: false, jobSold: false,
                    amountSold: 0, moneyOwed: 0, followUpPlan: '',
                    leftEstimate: false, estimateAmount: 0,
                    tradePlumbing: false, tradeHVAC: false,
                    tradeElectrical: false, tradeCameras: false,
                    timestamp: Date.now(), timeOfDay: new Date().getHours()
                });
            };

            const upCall = (pid, d, cid, f, v) => {
                db.ref(`callLogs/${dataKey(pid,d)}/${cid}/${f}`).set(v);
            };

            const delCall = (pid, d, cid) => {
                if (confirm('Delete?')) db.ref(`callLogs/${dataKey(pid,d)}/${cid}`).remove();
            };

            const getCalls = (pid, d) => {
                const k = dataKey(pid, d);
                const l = logs[k];
                if (!l) return [];
                return Object.keys(l).map(id => ({ id, ...l[id] }));
            };

            const getMDates = d => {
                const y = d.getFullYear();
                const m = d.getMonth();
                const arr = [];
                const last = new Date(y, m+1, 0).getDate();
                for (let day = 1; day <= last; day++) arr.push(new Date(y, m, day));
                return arr;
            };

            const getYDates = y => {
                const arr = [];
                for (let m = 0; m < 12; m++) {
                    arr.push(...getMDates(new Date(y, m, 1)));
                }
                return arr;
            };

            const calc = (pid, dates) => {
                const t = {
                    totalCalls: 0, callsSold: 0, amountSold: 0, moneyOwed: 0,
                    selfGenLeads: 0, companyLeads: 0, selfGenSales: 0, companySales: 0,
                    reviewsCompleted: 0, turnoversAttempted: 0, turnoversAccepted: 0,
                    rillaCompliant: 0, restorationLeads: 0, plansSold: 0,
                    upsellsCompleted: 0, estimatesLeft: 0, estimateValue: 0,
                    tradePlumbing: 0, tradeHVAC: 0, tradeElectrical: 0, tradeCameras: 0,
                    jobsComplete: 0, dailyBreakdown: {}, hourlyBreakdown: {}
                };
                dates.forEach(d => {
                    const calls = getCalls(pid, d);
                    const dateKey = dk(d);
                    t.dailyBreakdown[dateKey] = { calls: 0, sold: 0, revenue: 0 };
                    calls.forEach(c => {
                        t.totalCalls++;
                        t.dailyBreakdown[dateKey].calls++;
                        if (c.selfGeneratedLead) {
                            t.selfGenLeads++;
                            if (c.jobSold) t.selfGenSales++;
                        } else {
                            t.companyLeads++;
                            if (c.jobSold) t.companySales++;
                        }
                        if (c.jobSold) {
                            t.callsSold++;
                            t.dailyBreakdown[dateKey].sold++;
                            const amt = parseFloat(c.amountSold) || 0;
                            t.amountSold += amt;
                            t.dailyBreakdown[dateKey].revenue += amt;
                            const hr = c.timeOfDay || new Date(c.timestamp).getHours();
                            t.hourlyBreakdown[hr] = (t.hourlyBreakdown[hr] || 0) + 1;
                        }
                        t.moneyOwed += parseFloat(c.moneyOwed) || 0;
                        if (c.reviewCompleted) t.reviewsCompleted++;
                        if (c.turnoverAttempted) t.turnoversAttempted++;
                        if (c.turnoverAccepted) t.turnoversAccepted++;
                        if (c.rillaCompliant) t.rillaCompliant++;
                        if (c.restorationLead) t.restorationLeads++;
                        if (c.maintenancePlanSold) t.plansSold++;
                        if (c.upsellCompleted) t.upsellsCompleted++;
                        if (c.leftEstimate) {
                            t.estimatesLeft++;
                            t.estimateValue += parseFloat(c.estimateAmount) || 0;
                        }
                        if (c.tradePlumbing) t.tradePlumbing++;
                        if (c.tradeHVAC) t.tradeHVAC++;
                        if (c.tradeElectrical) t.tradeElectrical++;
                        if (c.tradeCameras) t.tradeCameras++;
                        if (c.jobComplete) t.jobsComplete++;
                    });
                });
                return t;
            };

            const getToday = () => {
                const today = new Date();
                let tc = 0, tr = 0;
                people.forEach(p => {
                    const c = getCalls(p.id, today);
                    tc += c.length;
                    tr += c.reduce((s, x) => s + (parseFloat(x.amountSold) || 0), 0);
                });
                return { totalCalls: tc, totalRevenue: tr };
            };

            const getStreak = pid => {
                let s = 0;
                const today = new Date();
                for (let i = 0; i < 30; i++) {
                    const d = new Date(today);
                    d.setDate(today.getDate() - i);
                    const c = getCalls(pid, d);
                    const has = c.some(x => x.jobSold);
                    if (has) s++;
                    else if (i > 0) break;
                }
                return s;
            };

            const getDays = pid => {
                const today = new Date();
                for (let i = 0; i < 90; i++) {
                    const d = new Date(today);
                    d.setDate(today.getDate() - i);
                    if (getCalls(pid, d).some(x => x.jobSold)) return i;
                }
                return 90;
            };

            const wTot = useMemo(() => selected ? calc(selected, week) : null, [selected, week, logs]);
            const mTot = useMemo(() => selected ? calc(selected, getMDates(date)) : null, [selected, date, logs]);
            const yTot = useMemo(() => selected ? calc(selected, getYDates(date.getFullYear())) : null, [selected, date, logs]);

            const allStats = useMemo(() => {
                return people.map(p => {
                    const m = calc(p.id, getMDates(date));
                    const w = calc(p.id, week);
                    const y = calc(p.id, getYDates(date.getFullYear()));
                    const s = getStreak(p.id);
                    const d = getDays(p.id);
                    return { ...p, ...m, weekRevenue: w.amountSold, yearRevenue: y.amountSold, streak: s, daysSinceSale: d };
                }).sort((a,b) => b.amountSold - a.amountSold);
            }, [people, date, week, logs]);

            const twTotal = useMemo(() => allStats.reduce((s,m) => s + m.weekRevenue, 0), [allStats]);
            const tmTotal = useMemo(() => allStats.reduce((s,m) => s + m.amountSold, 0), [allStats]);
            const tyTotal = useMemo(() => allStats.reduce((s,m) => s + m.yearRevenue, 0), [allStats]);
            const todayS = useMemo(() => getToday(), [people, logs]);
            const topW = useMemo(() => [...allStats].sort((a,b) => b.weekRevenue - a.weekRevenue)[0], [allStats]);

            const upMG = (pid, v) => db.ref(`monthlyGoals/${pid}_${mk(date)}`).set(parseFloat(v) || 0);
            const upYG = (pid, v) => db.ref(`yearlyGoals/${pid}_${yk(date)}`).set(parseFloat(v) || 0);
            const getMG = pid => mGoals[`${pid}_${mk(date)}`] || 0;
            const getYG = pid => yGoals[`${pid}_${yk(date)}`] || 0;
            const upTMG = v => db.ref('teamMonthlyGoal').set(parseFloat(v) || 0);
            const upComm = v => db.ref('commissionRate').set(parseFloat(v) || 0);
            const calcComm = amt => (amt * (comm / 100)).toFixed(2);

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-2xl font-bold text-blue-600">Loading...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 p-4">
                    <div className="max-w-7xl mx-auto">
                        <h1 className="text-3xl font-bold mb-6 text-blue-900">🔧 Action Plumbing Sales Tracker</h1>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                            <div className="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-6 rounded-lg shadow-lg">
                                <p className="text-sm font-semibold opacity-90">Today's Calls</p>
                                <p className="text-4xl font-bold">{todayS.totalCalls}</p>
                                <p className="text-xs opacity-75 mt-1">All team</p>
                            </div>
                            <div className="bg-gradient-to-br from-green-500 to-green-600 text-white p-6 rounded-lg shadow-lg">
                                <p className="text-sm font-semibold opacity-90">Today's Revenue</p>
                                <p className="text-4xl font-bold">${todayS.totalRevenue.toLocaleString()}</p>
                                <p className="text-xs opacity-75 mt-1">Team total</p>
                            </div>
                            <div className="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-6 rounded-lg shadow-lg">
                                <p className="text-sm font-semibold opacity-90">Week's Revenue</p>
                                <p className="text-4xl font-bold">${twTotal.toLocaleString()}</p>
                                <p className="text-xs opacity-75 mt-1">Last 7 days</p>
                            </div>
                            <div className="bg-gradient-to-br from-orange-500 to-orange-600 text-white p-6 rounded-lg shadow-lg">
                                <p className="text-sm font-semibold opacity-90">Top Performer</p>
                                <p className="text-2xl font-bold">{topW?.name || 'N/A'}</p>
                                <p className="text-xs opacity-75 mt-1">${(topW?.weekRevenue || 0).toLocaleString()} this week</p>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-lg shadow-lg mb-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-xl font-semibold">Sales Team</h2>
                                {!showAdd && <button onClick={() => setShowAdd(true)} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">+ Add Person</button>}
                            </div>
                            {showAdd && (
                                <div className="mb-4 p-4 bg-blue-50 rounded-lg border-2 border-blue-200">
                                    <div className="flex gap-2">
                                        <input type="text" value={newName} onChange={e => setNewName(e.target.value)} onKeyPress={e => e.key === 'Enter' && addP()} placeholder="Enter name" className="flex-1 px-4 py-2 border-2 rounded-lg" autoFocus />
                                        <button onClick={addP} className="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold">Add</button>
                                        <button onClick={() => { setShowAdd(false); setNewName(''); }} className="px-6 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-500 font-semibold">Cancel</button>
                                    </div>
                                </div>
                            )}
                            {people.length === 0 ? (
                                <div className="text-center py-12 bg-gray-50 rounded-lg"><p className="text-xl text-gray-500">No salespeople added yet</p></div>
                            ) : (
                                <div className="flex flex-wrap gap-3">
                                    {people.map(p => {
                                        const ps = allStats.find(m => m.id === p.id);
                                        const s = ps?.streak || 0;
                                        const d = ps?.daysSinceSale || 0;
                                        return (
                                            <div key={p.id} className="relative group">
                                                <button onClick={() => setSelected(p.id)} className={`px-6 py-3 rounded-lg font-bold text-lg transition-all ${selected === p.id ? 'bg-blue-600 text-white shadow-lg' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                                    {p.name}{s >= 3 && ' 🔥'}{d > 7 && ' ❄️'}
                                                </button>
                                                <button onClick={() => removeP(p.id)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs opacity-0 group-hover:opacity-100">×</button>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>

                        {selected && (
                            <>
                                <div className="bg-white p-6 rounded-lg shadow-lg mb-6">
                                    <h2 className="text-2xl font-bold mb-4 text-blue-900">📊 Monthly Performance Metrics - {date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h2>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                                        <div className="p-4 bg-blue-50 rounded-lg border-2 border-blue-300">
                                            <p className="text-sm font-bold text-blue-700">Closing Rate</p>
                                            <p className="text-3xl font-bold text-blue-900">{mTot?.totalCalls > 0 ? ((mTot.callsSold / mTot.totalCalls) * 100).toFixed(1) : 0}%</p>
                                            <p className="text-xs text-gray-600">{mTot?.callsSold} / {mTot?.totalCalls} calls</p>
                                        </div>
                                        <div className="p-4 bg-green-50 rounded-lg border-2 border-green-300">
                                            <p className="text-sm font-bold text-green-700">Call Average</p>
                                            <p className="text-3xl font-bold text-green-900">${mTot?.callsSold > 0 ? (mTot.amountSold / mTot.callsSold).toFixed(0) : 0}</p>
                                            <p className="text-xs text-gray-600">per sale</p>
                                        </div>
                                        <div className="p-4 bg-purple-50 rounded-lg border-2 border-purple-300">
                                            <p className="text-sm font-bold text-purple-700">Review Rate</p>
                                            <p className="text-3xl font-bold text-purple-900">{mTot?.totalCalls > 0 ? ((mTot.reviewsCompleted / mTot.totalCalls) * 100).toFixed(1) : 0}%</p>
                                            <p className="text-xs text-gray-600">{mTot?.reviewsCompleted} reviews</p>
                                        </div>
                                        <div className="p-4 bg-orange-50 rounded-lg border-2 border-orange-300">
                                            <p className="text-sm font-bold text-orange-700">Turnover Rate</p>
                                            <p className="text-3xl font-bold text-orange-900">{mTot?.turnoversAttempted > 0 ? ((mTot.turnoversAccepted / mTot.turnoversAttempted) * 100).toFixed(1) : 0}%</p>
                                            <p className="text-xs text-gray-600">{mTot?.turnoversAccepted} / {mTot?.turnoversAttempted}</p>
                                        </div>
                                        <div className="p-4 bg-indigo-50 rounded-lg border-2 border-indigo-300">
                                            <p className="text-sm font-bold text-indigo-700">Rilla Compliance</p>
                                            <p className="text-3xl font-bold text-indigo-900">{mTot?.totalCalls > 0 ? ((mTot.rillaCompliant / mTot.totalCalls) * 100).toFixed(1) : 0}%</p>
                                            <p className="text-xs text-gray-600">{mTot?.rillaCompliant} compliant</p>
                                        </div>
                                        <div className="p-4 bg-pink-50 rounded-lg border-2 border-pink-300">
                                            <p className="text-sm font-bold text-pink-700">Restoration Leads</p>
                                            <p className="text-3xl font-bold text-pink-900">{mTot?.restorationLeads || 0}</p>
                                            <p className="text-xs text-gray-600">this month</p>
                                        </div>
                                        <div className="p-4 bg-yellow-50 rounded-lg border-2 border-yellow-300">
                                            <p className="text-sm font-bold text-yellow-700">Plans Sold</p>
                                            <p className="text-3xl font-bold text-yellow-900">{mTot?.plansSold || 0}</p>
                                            <p className="text-xs text-gray-600">maintenance</p>
                                        </div>
                                        <div className="p-4 bg-teal-50 rounded-lg border-2 border-teal-300">
                                            <p className="text-sm font-bold text-teal-700">Membership Rate</p>
                                            <p className="text-3xl font-bold text-teal-900">{mTot?.callsSold > 0 ? ((mTot.plansSold / mTot.callsSold) * 100).toFixed(1) : 0}%</p>
                                            <p className="text-xs text-gray-600">of sales</p>
                                        </div>
                                        <div className="p-4 bg-red-50 rounded-lg border-2 border-red-300">
                                            <p className="text-sm font-bold text-red-700">Upsell Rate</p>
                                            <p className="text-3xl font-bold text-red-900">{mTot?.callsSold > 0 ? ((mTot.upsellsCompleted / mTot.callsSold) * 100).toFixed(1) : 0}%</p>
                                            <p className="text-xs text-gray-600">{mTot?.upsellsCompleted} upsells</p>
                                        </div>
                                        <div className="p-4 bg-cyan-50 rounded-lg border-2 border-cyan-300 col-span-2">
                                            <p className="text-sm font-bold text-cyan-700">Year Total</p>
                                            <p className="text-4xl font-bold text-cyan-900">${(yTot?.amountSold || 0).toLocaleString()}</p>
                                            <p className="text-xs text-gray-600">{yTot?.callsSold || 0} sales</p>
                                        </div>
                                        <div className="p-4 bg-lime-50 rounded-lg border-2 border-lime-300">
                                            <p className="text-sm font-bold text-lime-700">Commission</p>
                                            <p className="text-3xl font-bold text-lime-900">${comm > 0 ? calcComm(mTot?.amountSold || 0) : '0'}</p>
                                            <p className="text-xs text-gray-600">at {comm}%</p>
                                        </div>
                                    </div>
                                    <div className="p-4 bg-gray-50 rounded-lg border">
                                        <label className="text-sm font-bold">Commission Rate (%):</label>
                                        <input type="number" value={comm || ''} onChange={e => upComm(e.target.value)} className="ml-2 px-3 py-2 border-2 rounded-lg w-24" step="0.1" />
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-lg shadow-lg mb-6">
                                    <h2 className="text-2xl font-bold mb-4 text-purple-900">🎯 Goals & Estimates Tracker</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="p-4 bg-purple-50 rounded-lg border-2 border-purple-300">
                                            <h3 className="font-bold mb-3">Individual Monthly Goal</h3>
                                            <input type="number" value={getMG(selected) || ''} onChange={e => upMG(selected, e.target.value)} className="w-full px-3 py-2 border-2 rounded-lg mb-2" placeholder="Set Goal ($)" />
                                            {getMG(selected) > 0 && (
                                                <div className="space-y-2">
                                                    <div className="flex justify-between text-sm">
                                                        <span>Progress:</span>
                                                        <span className="font-bold">{((mTot?.amountSold / getMG(selected)) * 100).toFixed(1)}%</span>
                                                    </div>
                                                    <div className="w-full bg-gray-200 rounded-full h-6">
                                                        <div className={`h-full rounded-full flex items-center justify-center text-white text-xs font-bold ${(mTot?.amountSold / getMG(selected)) >= 1 ? 'bg-green-600' : (mTot?.amountSold / getMG(selected)) >= 0.5 ? 'bg-yellow-500' : 'bg-red-500'}`} style={{ width: `${Math.min((mTot?.amountSold / getMG(selected)) * 100, 100)}%` }}>
                                                            {((mTot?.amountSold / getMG(selected)) * 100).toFixed(0)}%
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-3 gap-2 text-sm pt-2">
                                                        <div><p className="text-xs text-gray-600">Sold</p><p className="font-bold">${(mTot?.amountSold || 0).toLocaleString()}</p></div>
                                                        <div><p className="text-xs text-gray-600">Goal</p><p className="font-bold">${getMG(selected).toLocaleString()}</p></div>
                                                        <div><p className="text-xs text-gray-600">Remaining</p><p className="font-bold text-orange-600">${Math.max(0, getMG(selected) - (mTot?.amountSold || 0)).toLocaleString()}</p></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="p-4 bg-orange-50 rounded-lg border-2 border-orange-300">
                                            <h3 className="font-bold mb-3">📋 Estimates Left This Month</h3>
                                            <div className="space-y-3">
                                                <div className="p-3 bg-white rounded border-2 border-orange-400">
                                                    <p className="text-sm text-gray-600">Total Estimates</p>
                                                    <p className="text-4xl font-bold text-orange-900">{mTot?.estimatesLeft || 0}</p>
                                                </div>
                                                <div className="p-3 bg-white rounded border-2 border-orange-400">
                                                    <p className="text-sm text-gray-600">Potential Revenue</p>
                                                    <p className="text-4xl font-bold text-orange-900">${(mTot?.estimateValue || 0).toLocaleString()}</p>
                                                </div>
                                                <p className="text-xs text-gray-600 italic">💡 Follow up on these estimates to close more deals!</p>
                                            </div>
                                        </div>

                                        <div className="p-4 bg-indigo-50 rounded-lg border-2 border-indigo-300">
                                            <h3 className="font-bold mb-3">Team Monthly Goal</h3>
                                            <input type="number" value={tmGoal || ''} onChange={e => upTMG(e.target.value)} className="w-full px-3 py-2 border-2 rounded-lg mb-2" placeholder="Set Team Goal ($)" />
                                            {tmGoal > 0 && (
                                                <div className="space-y-2">
                                                    <div className="flex justify-between text-sm">
                                                        <span>Progress:</span>
                                                        <span className="font-bold">{((tmTotal / tmGoal) * 100).toFixed(1)}%</span>
                                                    </div>
                                                    <div className="w-full bg-gray-200 rounded-full h-6">
                                                        <div className={`h-full rounded-full flex items-center justify-center text-white text-xs font-bold ${(tmTotal / tmGoal) >= 1 ? 'bg-green-600' : (tmTotal / tmGoal) >= 0.5 ? 'bg-yellow-500' : 'bg-red-500'}`} style={{ width: `${Math.min((tmTotal / tmGoal) * 100, 100)}%` }}>
                                                            {((tmTotal / tmGoal) * 100).toFixed(0)}%
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-3 gap-2 text-sm pt-2">
                                                        <div><p className="text-xs text-gray-600">Team Sold</p><p className="font-bold">${tmTotal.toLocaleString()}</p></div>
                                                        <div><p className="text-xs text-gray-600">Goal</p><p className="font-bold">${tmGoal.toLocaleString()}</p></div>
                                                        <div><p className="text-xs text-gray-600">Remaining</p><p className="font-bold text-orange-600">${Math.max(0, tmGoal - tmTotal).toLocaleString()}</p></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="p-4 bg-blue-50 rounded-lg border-2 border-blue-300">
                                            <h3 className="font-bold mb-3">Yearly Goal - {date.getFullYear()}</h3>
                                            <input type="number" value={getYG(selected) || ''} onChange={e => upYG(selected, e.target.value)} className="w-full px-3 py-2 border-2 rounded-lg mb-2" placeholder="Set Yearly Goal ($)" />
                                            {getYG(selected) > 0 && (
                                                <div className="space-y-2">
                                                    <div className="flex justify-between text-sm">
                                                        <span>Progress:</span>
                                                        <span className="font-bold">{((yTot?.amountSold / getYG(selected)) * 100).toFixed(1)}%</span>
                                                    </div>
                                                    <div className="w-full bg-gray-200 rounded-full h-6">
                                                        <div className={`h-full rounded-full flex items-center justify-center text-white text-xs font-bold ${(yTot?.amountSold / getYG(selected)) >= 1 ? 'bg-green-600' : (yTot?.amountSold / getYG(selected)) >= 0.5 ? 'bg-yellow-500' : 'bg-red-500'}`} style={{ width: `${Math.min((yTot?.amountSold / getYG(selected)) * 100, 100)}%` }}>
                                                            {((yTot?.amountSold / getYG(selected)) * 100).toFixed(0)}%
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-3 gap-2 text-sm pt-2">
                                                        <div><p className="text-xs text-gray-600">Sold So Far</p><p className="font-bold">${(yTot?.amountSold || 0).toLocaleString()}</p></div>
                                                        <div><p className="text-xs text-gray-600">Goal</p><p className="font-bold">${getYG(selected).toLocaleString()}</p></div>
                                                        <div><p className="text-xs text-gray-600">Left</p><p className="font-bold text-orange-600">${Math.max(0, getYG(selected) - (yTot?.amountSold || 0)).toLocaleString()}</p></div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-gradient-to-r from-blue-50 to-indigo-50 p-6 rounded-lg shadow-lg border-2 border-blue-300 mb-6">
                                    <div className="flex items-center justify-between mb-6">
                                        <button onClick={() => setDate(new Date(date.getTime() - 7*24*60*60*1000))} className="p-3 bg-white rounded-full hover:bg-blue-100 shadow font-bold text-xl">←</button>
                                        <h2 className="text-xl font-bold text-blue-900">{week[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - {week[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</h2>
                                        <button onClick={() => setDate(new Date(date.getTime() + 7*24*60*60*1000))} className="p-3 bg-white rounded-full hover:bg-blue-100 shadow font-bold text-xl">→</button>
                                    </div>
                                    <div className="grid grid-cols-7 gap-3">
                                        {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => <div key={d} className="text-center text-sm font-bold text-blue-700 mb-2">{d}</div>)}
                                        {week.map((d, i) => {
                                            const c = getCalls(selected, d);
                                            const sold = c.filter(x => x.jobSold);
                                            const tot = c.reduce((s, x) => s + (parseFloat(x.amountSold) || 0), 0);
                                            const dateKey = dk(d);
                                            const isT = dk(new Date()) === dateKey;
                                            return (
                                                <button key={i} onClick={() => setSelDate(selDate === dateKey ? null : dateKey)} className={`p-4 rounded-xl border-2 transition-all ${selDate === dateKey ? 'border-blue-600 bg-blue-100 shadow-lg' : c.length > 0 ? 'border-green-400 bg-green-50 hover:shadow-md' : isT ? 'border-blue-300 bg-white shadow-md' : 'border-gray-200 bg-white hover:border-gray-300'}`}>
                                                    <div className="text-xl font-bold">{d.getDate()}</div>
                                                    {c.length > 0 && <div className="mt-2"><div className="text-xs font-bold text-green-700">{sold.length} sold</div><div className="text-xs font-bold text-green-700">${tot.toLocaleString()}</div></div>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {selDate && (
                                    <div className="bg-white p-6 rounded-lg shadow-lg mb-6">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-2xl font-bold text-blue-900">📞 Call Logs</h3>
                                            <button onClick={() => addCall(selected, week.find(d => dk(d) === selDate))} className="px-5 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold">+ Add Call</button>
                                        </div>
                                        <div className="space-y-4 max-h-[600px] overflow-y-auto">
                                            {getCalls(selected, week.find(d => dk(d) === selDate)).length === 0 ? (
                                                <p className="text-center text-gray-500 py-8">No calls</p>
                                            ) : (
                                                getCalls(selected, week.find(d => dk(d) === selDate)).map(c => (
                                                    <div key={c.id} className="p-4 bg-gray-50 rounded-lg border-2 border-gray-200">
                                                        <div className="flex justify-between mb-3">
                                                            <span className="text-sm font-bold text-gray-600">Call Entry</span>
                                                            <button onClick={() => delCall(selected, week.find(d => dk(d) === selDate), c.id)} className="text-red-600 font-bold hover:text-red-800">🗑️</button>
                                                        </div>
                                                        <div className="space-y-3">
                                                            <input type="text" value={c.customerName || ''} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'customerName', e.target.value)} className="w-full px-3 py-2 border-2 rounded-lg" placeholder="Customer Name" />
                                                            <input type="text" value={c.jobNumber || ''} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'jobNumber', e.target.value)} className="w-full px-3 py-2 border-2 rounded-lg" placeholder="Job Number" />
                                                            <input type="tel" value={c.customerPhone || ''} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'customerPhone', e.target.value)} className="w-full px-3 py-2 border-2 rounded-lg" placeholder="Customer Phone" />
                                                            
                                                            <label className="flex items-center gap-3 p-3 bg-white rounded-lg border-2 border-gray-300 cursor-pointer hover:border-green-400">
                                                                <input type="checkbox" checked={c.jobSold || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'jobSold', e.target.checked)} className="w-5 h-5" />
                                                                <span className="font-bold text-lg">💰 Job Sold</span>
                                                            </label>

                                                            {c.jobSold && (
                                                                <div className="space-y-2">
                                                                    <input type="number" value={c.amountSold || ''} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'amountSold', parseFloat(e.target.value) || 0)} className="w-full px-3 py-2 border-2 border-green-300 rounded-lg text-lg font-bold" placeholder="Amount Sold ($)" />
                                                                    <input type="number" value={c.moneyOwed || ''} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'moneyOwed', parseFloat(e.target.value) || 0)} className="w-full px-3 py-2 border-2 border-orange-300 rounded-lg font-bold" placeholder="Money Owed ($)" />
                                                                </div>
                                                            )}

                                                            <label className="flex items-center gap-3 p-3 bg-white rounded-lg border-2 border-gray-300 cursor-pointer hover:border-red-400">
                                                                <input type="checkbox" checked={c.jobCancelled || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'jobCancelled', e.target.checked)} className="w-5 h-5" />
                                                                <span className="font-bold text-lg">❌ Job Cancelled</span>
                                                            </label>

                                                            {c.jobCancelled && (
                                                                <textarea value={c.cancelReason || ''} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'cancelReason', e.target.value)} className="w-full px-3 py-2 border-2 border-red-300 rounded-lg" placeholder="Reason for cancellation..." rows="3" />
                                                            )}

                                                            <label className="flex items-center gap-3 p-3 bg-white rounded-lg border-2 border-gray-300 cursor-pointer hover:border-orange-400">
                                                                <input type="checkbox" checked={c.leftEstimate || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'leftEstimate', e.target.checked)} className="w-5 h-5" />
                                                                <span className="font-bold">📋 Left Estimate</span>
                                                            </label>

                                                            {c.leftEstimate && (
                                                                <input type="number" value={c.estimateAmount || ''} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'estimateAmount', parseFloat(e.target.value) || 0)} className="w-full px-3 py-2 border-2 border-orange-300 rounded-lg" placeholder="Estimate Amount ($)" />
                                                            )}

                                                            <div className="border-t-2 pt-3 mt-3">
                                                                <p className="font-bold text-sm text-gray-700 mb-2">Trade Type</p>
                                                                <div className="grid grid-cols-2 gap-2">
                                                                    <label className="flex items-center gap-2 p-2 bg-blue-50 rounded border border-blue-300 cursor-pointer">
                                                                        <input type="checkbox" checked={c.tradePlumbing || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'tradePlumbing', e.target.checked)} className="w-4 h-4" />
                                                                        <span className="text-sm font-bold text-blue-700">🔧 Plumbing</span>
                                                                    </label>
                                                                    <label className="flex items-center gap-2 p-2 bg-yellow-50 rounded border border-yellow-300 cursor-pointer">
                                                                        <input type="checkbox" checked={c.tradeElectrical || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'tradeElectrical', e.target.checked)} className="w-4 h-4" />
                                                                        <span className="text-sm font-bold text-yellow-700">⚡ Electrical</span>
                                                                    </label>
                                                                    <label className="flex items-center gap-2 p-2 bg-red-50 rounded border border-red-300 cursor-pointer">
                                                                        <input type="checkbox" checked={c.tradeHVAC || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'tradeHVAC', e.target.checked)} className="w-4 h-4" />
                                                                        <span className="text-sm font-bold text-red-700">🌡️ HVAC</span>
                                                                    </label>
                                                                    <label className="flex items-center gap-2 p-2 bg-purple-50 rounded border border-purple-300 cursor-pointer">
                                                                        <input type="checkbox" checked={c.tradeCameras || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'tradeCameras', e.target.checked)} className="w-4 h-4" />
                                                                        <span className="text-sm font-bold text-purple-700">📹 Cameras</span>
                                                                    </label>
                                                                </div>
                                                            </div>

                                                            <div className="border-t-2 pt-3 mt-3">
                                                                <p className="font-bold text-sm text-gray-700 mb-2">Performance</p>
                                                                <div className="grid grid-cols-2 gap-2">
                                                                    <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={c.reviewCompleted || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'reviewCompleted', e.target.checked)} className="w-4 h-4" /><span>✅ Review</span></label>
                                                                    <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={c.restorationLead || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'restorationLead', e.target.checked)} className="w-4 h-4" /><span>🏠 Restoration</span></label>
                                                                    <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={c.turnoverAttempted || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'turnoverAttempted', e.target.checked)} className="w-4 h-4" /><span>🔄 Turnover Tried</span></label>
                                                                    <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={c.turnoverAccepted || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'turnoverAccepted', e.target.checked)} disabled={!c.turnoverAttempted} className="w-4 h-4" /><span>✔️ Turnover OK</span></label>
                                                                    <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={c.selfGeneratedLead || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'selfGeneratedLead', e.target.checked)} className="w-4 h-4" /><span>🎯 Self-Gen</span></label>
                                                                    <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={c.rillaCompliant || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'rillaCompliant', e.target.checked)} className="w-4 h-4" /><span>🎙️ Rilla</span></label>
                                                                    <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={c.maintenancePlanSold || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'maintenancePlanSold', e.target.checked)} className="w-4 h-4" /><span>🛡️ Plan</span></label>
                                                                    <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={c.upsellCompleted || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'upsellCompleted', e.target.checked)} className="w-4 h-4" /><span>⬆️ Upsell</span></label>
                                                                    <label className="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" checked={c.jobComplete || false} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'jobComplete', e.target.checked)} className="w-4 h-4" /><span>✔️ Complete</span></label>
                                                                </div>
                                                                {c.upsellCompleted && <input type="number" value={c.upsellAmount || ''} onChange={e => upCall(selected, week.find(d => dk(d) === selDate), c.id, 'upsellAmount', parseFloat(e.target.value) || 0)} className="w-full px-3 py-2 border-2 rounded-lg mt-2" placeholder="Upsell Amount ($)" />}
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                )}

                                <div className="bg-gradient-to-br from-green-50 to-emerald-50 p-6 rounded-lg shadow-lg border-2 border-green-400">
                                    <h2 className="text-2xl font-bold mb-4 text-green-900">🏅 Monthly Leaderboard - {date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h2>
                                    <div className="space-y-3">
                                        {allStats.map((p, i) => {
                                            const cr = p.totalCalls > 0 ? (p.callsSold / p.totalCalls) * 100 : 0;
                                            const med = ['🥇','🥈','🥉'];
                                            const tit = ['👑 Month Leader','⭐ Runner Up','🎯 Bronze'];
                                            const g = getMG(p.id);
                                            const gp = g > 0 ? (p.amountSold / g) * 100 : 0;
                                            return (
                                                <div key={p.id} className={`p-4 rounded-lg border-2 ${i===0?'bg-green-100 border-green-400':i===1?'bg-gray-100 border-gray-400':i===2?'bg-orange-100 border-orange-400':'bg-white border-gray-300'}`}>
                                                    <div className="flex items-center justify-between mb-2">
                                                        <div className="flex items-center gap-3">
                                                            <span className="text-2xl">{i<3?med[i]:`#${i+1}`}</span>
                                                            <div>
                                                                <p className="font-bold text-lg">{p.name} {p.streak>=3&&'🔥'}</p>
                                                                {i<3&&<p className="text-xs text-gray-600">{tit[i]}</p>}
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <p className="text-sm text-gray-600">Month Total</p>
                                                            <p className="font-bold text-xl">${p.amountSold.toLocaleString()}</p>
                                                            <p className="text-xs text-gray-600">{p.callsSold} sales • {cr.toFixed(1)}% close</p>
                                                        </div>
                                                    </div>
                                                    {g>0&&(
                                                        <div className="mt-2">
                                                            <div className="flex justify-between text-xs mb-1">
                                                                <span>Goal:</span>
                                                                <span className="font-bold">{gp.toFixed(0)}% of ${g.toLocaleString()}</span>
                                                            </div>
                                                            <div className="w-full bg-gray-200 rounded-full h-2">
                                                                <div className={`h-full rounded-full ${gp>=100?'bg-green-600':gp>=50?'bg-yellow-500':'bg-red-500'}`} style={{width:`${Math.min(gp,100)}%`}}></div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
