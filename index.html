<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Plumbing Sales Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        firebase.initializeApp({
            apiKey: "AIzaSyD9POKxbl9hSt2FNtzdv3RPVnAb0wWsNbU",
            authDomain: "action-sales-tracker.firebaseapp.com",
            databaseURL: "https://action-sales-tracker-default-rtdb.firebaseio.com",
            projectId: "action-sales-tracker",
            storageBucket: "action-sales-tracker.firebasestorage.app",
            messagingSenderId: "686455834332",
            appId: "1:686455834332:web:84e9b843f912522bbdd619"
        });

        const database = firebase.database();
        const { useState, useEffect } = React;

        function App() {
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                // Test Firebase connection
                database.ref('.info/connected').on('value', (snap) => {
                    if (snap.val() === true) {
                        console.log('Firebase connected!');
                        setLoading(false);
                    }
                });
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-3xl font-bold text-blue-600 mb-4">Loading...</div>
                            <div className="text-gray-600">Connecting to Firebase...</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 p-4">
                    <div className="max-w-7xl mx-auto">
                        <h1 className="text-4xl font-bold mb-6 text-blue-900">🔧 Action Plumbing Sales Tracker</h1>
                        
                        <div className="bg-white p-8 rounded-lg shadow-lg">
                            <div className="text-center">
                                <h2 className="text-2xl font-bold text-green-600 mb-4">✅ System Online!</h2>
                                <p className="text-gray-700 mb-2">Firebase is connected and ready.</p>
                                <p className="text-gray-600">Full tracker features will be loaded next.</p>
                            </div>
                        </div>

                        <div className="mt-6 bg-blue-50 p-6 rounded-lg border-2 border-blue-300">
                            <h3 className="font-bold text-lg mb-2">🎯 Next Steps:</h3>
                            <ul className="list-disc list-inside space-y-1 text-gray-700">
                                <li>Add team members</li>
                                <li>Track daily calls and sales</li>
                                <li>Monitor performance metrics</li>
                                <li>View leaderboards</li>
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
