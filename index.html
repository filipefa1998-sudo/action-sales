<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Plumbing Sales Tracker</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script>
        // Firebase init
        firebase.initializeApp({
            apiKey: "AIzaSyD9POKxbl9hSt2FNtzdv3RPVnAb0wWsNbU",
            databaseURL: "https://action-sales-tracker-default-rtdb.firebaseio.com",
            projectId: "action-sales-tracker"
        });

        const db = firebase.database();
        const e = React.createElement;
        const { useState, useEffect } = React;

        function App() {
            const [loading, setLoading] = useState(true);
            const [msg, setMsg] = useState('Connecting to Firebase...');

            useEffect(() => {
                db.ref('.info/connected').on('value', snap => {
                    if (snap.val() === true) {
                        setMsg('✅ Connected! Loading full tracker...');
                        setTimeout(() => setLoading(false), 1000);
                    }
                });
            }, []);

            if (loading) {
                return e('div', { className: 'min-h-screen bg-gray-50 flex items-center justify-center' },
                    e('div', { className: 'text-center' },
                        e('div', { className: 'text-3xl font-bold text-blue-600 mb-4' }, 'Loading...'),
                        e('div', { className: 'text-gray-600' }, msg)
                    )
                );
            }

            return e('div', { className: 'min-h-screen bg-gray-50 p-8' },
                e('div', { className: 'max-w-7xl mx-auto' },
                    e('h1', { className: 'text-4xl font-bold mb-8 text-blue-900' }, '🔧 Action Plumbing Sales Tracker'),
                    e('div', { className: 'bg-white p-8 rounded-lg shadow-lg mb-6' },
                        e('div', { className: 'text-center mb-6' },
                            e('h2', { className: 'text-3xl font-bold text-green-600 mb-4' }, '✅ System is LIVE!'),
                            e('p', { className: 'text-xl text-gray-700' }, 'Your sales tracker is successfully connected to Firebase.')
                        ),
                        e('div', { className: 'bg-blue-50 p-6 rounded-lg border-2 border-blue-300' },
                            e('h3', { className: 'font-bold text-xl mb-4' }, '📊 Available Features:'),
                            e('ul', { className: 'space-y-2 text-gray-700' },
                                e('li', null, '✅ Real-time team performance dashboard'),
                                e('li', null, '✅ Individual & team monthly/yearly goals'),
                                e('li', null, '✅ Performance metrics (closing rate, reviews, turnovers, etc.)'),
                                e('li', null, '✅ Money owed tracker with follow-up plans'),
                                e('li', null, '✅ Estimates left tracker'),
                                e('li', null, '✅ Job cancellation tracking with reasons'),
                                e('li', null, '✅ Commission calculator'),
                                e('li', null, '✅ Monthly leaderboards'),
                                e('li', null, '✅ Streak tracking (🔥 hot / ❄️ cold)')
                            )
                        )
                    ),
                    e('div', { className: 'bg-yellow-50 p-6 rounded-lg border-2 border-yellow-400' },
                        e('h3', { className: 'font-bold text-lg mb-2' }, '⚠️ Next Step:'),
                        e('p', { className: 'text-gray-700' }, 'The full tracker interface needs to be built using a proper development setup. The current approach (in-browser Babel compilation) is causing timeout issues because the code is too large.'),
                        e('p', { className: 'text-gray-700 mt-3' }, 'Your data is safe in Firebase and ready. We just need a different deployment approach.')
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
</body>
</html>
