<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Plumbing - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        firebase.initializeApp({
            apiKey: "AIzaSyD9POKxbl9hSt2FNtzdv3RPVnAb0wWsNbU",
            databaseURL: "https://action-sales-tracker-default-rtdb.firebaseio.com",
            projectId: "action-sales-tracker"
        });

        const db = firebase.database();
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [people, setPeople] = useState([]);
            const [selected, setSelected] = useState(null);
            const [logs, setLogs] = useState({});
            const [newName, setNewName] = useState('');
            const [showAdd, setShowAdd] = useState(false);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                db.ref('salespeople').on('value', s => {
                    const d = s.val();
                    if (d) {
                        const arr = Object.keys(d).map(k => ({ id: k, name: d[k].name }));
                        setPeople(arr);
                        if (!selected && arr.length) {
                            setSelected(arr[0].id);
                            localStorage.setItem('selectedPerson', arr[0].id);
                        }
                    }
                    setLoading(false);
                });
                db.ref('callLogs').on('value', s => setLogs(s.val() || {}));
                
                const saved = localStorage.getItem('selectedPerson');
                if (saved) setSelected(saved);
                
                return () => {
                    db.ref('salespeople').off();
                    db.ref('callLogs').off();
                };
            }, []);

            const addP = () => {
                if (newName.trim()) {
                    db.ref('salespeople').push().set({ name: newName.trim() });
                    setNewName('');
                    setShowAdd(false);
                }
            };

            const removeP = id => {
                const p = people.find(x => x.id === id);
                if (confirm(`Remove ${p.name}?`)) {
                    db.ref(`salespeople/${id}`).remove();
                    if (selected === id) setSelected(null);
                }
            };

            const selectPerson = id => {
                setSelected(id);
                localStorage.setItem('selectedPerson', id);
            };

            const getToday = () => {
                const today = new Date();
                const dk = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                let tc = 0, tr = 0;
                people.forEach(p => {
                    const key = `${p.id}_${dk(today)}`;
                    const calls = logs[key];
                    if (calls) {
                        const arr = Object.values(calls);
                        tc += arr.length;
                        tr += arr.reduce((s, x) => s + (parseFloat(x.amountSold) || 0), 0);
                    }
                });
                return { totalCalls: tc, totalRevenue: tr };
            };

            const todayStats = useMemo(() => getToday(), [people, logs]);

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-2xl font-bold text-blue-600">Loading...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 p-4">
                    <div className="max-w-7xl mx-auto">
                        <h1 className="text-3xl font-bold mb-6 text-blue-900">🔧 Action Plumbing Sales Tracker</h1>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div className="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-6 rounded-lg shadow-lg">
                                <p className="text-sm font-semibold opacity-90">Today's Calls</p>
                                <p className="text-4xl font-bold">{todayStats.totalCalls}</p>
                                <p className="text-xs opacity-75 mt-1">All team members</p>
                            </div>
                            <div className="bg-gradient-to-br from-green-500 to-green-600 text-white p-6 rounded-lg shadow-lg">
                                <p className="text-sm font-semibold opacity-90">Today's Revenue</p>
                                <p className="text-4xl font-bold">${todayStats.totalRevenue.toLocaleString()}</p>
                                <p className="text-xs opacity-75 mt-1">Team total</p>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-lg shadow-lg mb-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-xl font-semibold">Select Team Member</h2>
                                {!showAdd && (
                                    <button onClick={() => setShowAdd(true)} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">
                                        + Add Person
                                    </button>
                                )}
                            </div>

                            {showAdd && (
                                <div className="mb-4 p-4 bg-blue-50 rounded-lg border-2 border-blue-200">
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={newName}
                                            onChange={e => setNewName(e.target.value)}
                                            onKeyPress={e => e.key === 'Enter' && addP()}
                                            placeholder="Enter name"
                                            className="flex-1 px-4 py-2 border-2 rounded-lg"
                                            autoFocus
                                        />
                                        <button onClick={addP} className="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold">Add</button>
                                        <button onClick={() => { setShowAdd(false); setNewName(''); }} className="px-6 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-500 font-semibold">Cancel</button>
                                    </div>
                                </div>
                            )}

                            {people.length === 0 ? (
                                <div className="text-center py-12 bg-gray-50 rounded-lg">
                                    <p className="text-xl text-gray-500">No salespeople added yet</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                    {people.map(p => (
                                        <div key={p.id} className="relative group">
                                            <button
                                                onClick={() => selectPerson(p.id)}
                                                className={`w-full px-6 py-4 rounded-lg font-bold text-lg transition-all ${
                                                    selected === p.id
                                                        ? 'bg-blue-600 text-white shadow-lg'
                                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                {p.name}
                                            </button>
                                            <button
                                                onClick={() => removeP(p.id)}
                                                className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs opacity-0 group-hover:opacity-100"
                                            >
                                                ×
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {selected && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <a href="calls.html" className="block p-8 bg-gradient-to-br from-green-500 to-green-600 text-white rounded-lg shadow-lg hover:shadow-xl transition-all text-center">
                                    <div className="text-5xl mb-3">📞</div>
                                    <h3 className="text-2xl font-bold">Log Calls</h3>
                                    <p className="text-sm opacity-90 mt-2">Add daily calls and track sales</p>
                                </a>

                                <a href="reports.html" className="block p-8 bg-gradient-to-br from-purple-500 to-purple-600 text-white rounded-lg shadow-lg hover:shadow-xl transition-all text-center">
                                    <div className="text-5xl mb-3">📊</div>
                                    <h3 className="text-2xl font-bold">View Reports</h3>
                                    <p className="text-sm opacity-90 mt-2">Performance metrics & leaderboards</p>
                                </a>

                                <a href="goals.html" className="block p-8 bg-gradient-to-br from-orange-500 to-orange-600 text-white rounded-lg shadow-lg hover:shadow-xl transition-all text-center">
                                    <div className="text-5xl mb-3">🎯</div>
                                    <h3 className="text-2xl font-bold">Goals & Estimates</h3>
                                    <p className="text-sm opacity-90 mt-2">Track goals and follow up on estimates</p>
                                </a>

                                <a href="money.html" className="block p-8 bg-gradient-to-br from-red-500 to-red-600 text-white rounded-lg shadow-lg hover:shadow-xl transition-all text-center">
                                    <div className="text-5xl mb-3">💰</div>
                                    <h3 className="text-2xl font-bold">Money Owed</h3>
                                    <p className="text-sm opacity-90 mt-2">Track outstanding payments</p>
                                </a>
                            </div>
                        )}

                        {!selected && people.length > 0 && (
                            <div className="bg-yellow-50 p-6 rounded-lg border-2 border-yellow-400 text-center">
                                <p className="text-lg font-bold text-yellow-900">👆 Please select a team member above to continue</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
