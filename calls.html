<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Calls - Action Plumbing</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="p-4 max-w-7xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="text-3xl font-bold text-blue-900">📞 Log Calls</h1>
            <a href="index.html" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 font-semibold">← Back to Dashboard</a>
        </div>

        <div id="personName" class="mb-4 text-xl font-bold text-gray-700"></div>

        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-6 rounded-lg shadow-lg border-2 border-blue-300 mb-6">
            <div class="flex items-center justify-between mb-6">
                <button id="prevWeek" class="p-3 bg-white rounded-full hover:bg-blue-100 shadow font-bold text-xl">←</button>
                <h2 id="weekTitle" class="text-xl font-bold text-blue-900"></h2>
                <button id="nextWeek" class="p-3 bg-white rounded-full hover:bg-blue-100 shadow font-bold text-xl">→</button>
            </div>
            <div id="calendar" class="grid grid-cols-7 gap-3"></div>
        </div>

        <div id="callLogs" style="display: none;" class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-2xl font-bold text-blue-900">Call Logs</h3>
                <button id="addCallBtn" class="px-5 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold">+ Add Call</button>
            </div>
            <div id="callsList" class="space-y-4 max-h-[600px] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyD9POKxbl9hSt2FNtzdv3RPVnAb0wWsNbU",
            databaseURL: "https://action-sales-tracker-default-rtdb.firebaseio.com",
            projectId: "action-sales-tracker"
        });

        const db = firebase.database();
        const selectedPerson = localStorage.getItem('selectedPerson');
        if (!selectedPerson) {
            window.location.href = 'index.html';
        }

        let currentDate = new Date();
        let selectedDate = null;
        let personName = '';
        let allLogs = {};

        db.ref(`salespeople/${selectedPerson}`).once('value', s => {
            personName = s.val()?.name || 'Unknown';
            document.getElementById('personName').textContent = `Logging calls for: ${personName}`;
        });

        db.ref('callLogs').on('value', s => {
            allLogs = s.val() || {};
            renderCalendar();
            if (selectedDate) renderCalls();
        });

        function getWeekDates(date) {
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(date);
            monday.setDate(diff);
            const week = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                week.push(d);
            }
            return week;
        }

        function getDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        }

        function getDataKey(date) {
            return `${selectedPerson}_${getDateKey(date)}`;
        }

        function renderCalendar() {
            const week = getWeekDates(currentDate);
            const weekTitle = `${week[0].toLocaleDateString('en-US', {month:'short',day:'numeric'})} - ${week[6].toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'})}`;
            document.getElementById('weekTitle').textContent = weekTitle;

            const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
            let html = days.map(d => `<div class="text-center text-sm font-bold text-blue-700 mb-2">${d}</div>`).join('');

            week.forEach(date => {
                const key = getDataKey(date);
                const calls = allLogs[key] ? Object.values(allLogs[key]) : [];
                const sold = calls.filter(c => c.jobSold);
                const total = calls.reduce((s, c) => s + (parseFloat(c.amountSold) || 0), 0);
                const dateKey = getDateKey(date);
                const isToday = getDateKey(new Date()) === dateKey;
                const isSelected = selectedDate === dateKey;

                const classes = `p-4 rounded-xl border-2 transition-all cursor-pointer ${
                    isSelected ? 'border-blue-600 bg-blue-100 shadow-lg' :
                    calls.length > 0 ? 'border-green-400 bg-green-50 hover:shadow-md' :
                    isToday ? 'border-blue-300 bg-white shadow-md' :
                    'border-gray-200 bg-white hover:border-gray-300'
                }`;

                html += `
                    <div class="${classes}" onclick="selectDate('${dateKey}', ${date.getTime()})">
                        <div class="text-xl font-bold">${date.getDate()}</div>
                        ${calls.length > 0 ? `
                            <div class="mt-2">
                                <div class="text-xs font-bold text-green-700">${sold.length} sold</div>
                                <div class="text-xs font-bold text-green-700">$${total.toLocaleString()}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            document.getElementById('calendar').innerHTML = html;
        }

        window.selectDate = function(dateKey, timestamp) {
            selectedDate = dateKey;
            window.selectedDateObj = new Date(timestamp);
            renderCalendar();
            document.getElementById('callLogs').style.display = 'block';
            renderCalls();
        };

        function renderCalls() {
            const key = getDataKey(window.selectedDateObj);
            const calls = allLogs[key] ? Object.entries(allLogs[key]) : [];

            if (calls.length === 0) {
                document.getElementById('callsList').innerHTML = '<p class="text-center text-gray-500 py-8">No calls logged for this day</p>';
                return;
            }

            document.getElementById('callsList').innerHTML = calls.map(([id, call]) => `
                <div class="p-4 bg-gray-50 rounded-lg border-2 border-gray-200">
                    <div class="flex justify-between mb-3">
                        <span class="text-sm font-bold text-gray-600">Call Entry</span>
                        <button onclick="deleteCall('${id}')" class="text-red-600 font-bold hover:text-red-800">🗑️</button>
                    </div>
                    <div class="space-y-3">
                        <input type="text" value="${call.customerName || ''}" onchange="updateCall('${id}', 'customerName', this.value)" class="w-full px-3 py-2 border-2 rounded-lg" placeholder="Customer Name" />
                        <input type="text" value="${call.jobNumber || ''}" onchange="updateCall('${id}', 'jobNumber', this.value)" class="w-full px-3 py-2 border-2 rounded-lg" placeholder="Job Number" />
                        <input type="tel" value="${call.customerPhone || ''}" onchange="updateCall('${id}', 'customerPhone', this.value)" class="w-full px-3 py-2 border-2 rounded-lg" placeholder="Customer Phone" />
                        
                        <label class="flex items-center gap-3 p-3 bg-white rounded-lg border-2 border-gray-300 cursor-pointer hover:border-green-400">
                            <input type="checkbox" ${call.jobSold ? 'checked' : ''} onchange="updateCall('${id}', 'jobSold', this.checked)" class="w-5 h-5" />
                            <span class="font-bold text-lg">💰 Job Sold</span>
                        </label>

                        ${call.jobSold ? `
                            <input type="number" value="${call.amountSold || ''}" onchange="updateCall('${id}', 'amountSold', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border-2 border-green-300 rounded-lg text-lg font-bold" placeholder="Amount Sold ($)" />
                            <input type="number" value="${call.moneyOwed || ''}" onchange="updateCall('${id}', 'moneyOwed', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border-2 border-orange-300 rounded-lg font-bold" placeholder="Money Owed ($)" />
                        ` : ''}

                        <label class="flex items-center gap-3 p-3 bg-white rounded-lg border-2 border-gray-300 cursor-pointer hover:border-red-400">
                            <input type="checkbox" ${call.jobCancelled ? 'checked' : ''} onchange="updateCall('${id}', 'jobCancelled', this.checked)" class="w-5 h-5" />
                            <span class="font-bold text-lg">❌ Job Cancelled</span>
                        </label>

                        ${call.jobCancelled ? `
                            <textarea onchange="updateCall('${id}', 'cancelReason', this.value)" class="w-full px-3 py-2 border-2 border-red-300 rounded-lg" placeholder="Reason for cancellation..." rows="3">${call.cancelReason || ''}</textarea>
                        ` : ''}

                        <label class="flex items-center gap-3 p-3 bg-white rounded-lg border-2 border-gray-300 cursor-pointer hover:border-orange-400">
                            <input type="checkbox" ${call.leftEstimate ? 'checked' : ''} onchange="updateCall('${id}', 'leftEstimate', this.checked)" class="w-5 h-5" />
                            <span class="font-bold">📋 Left Estimate</span>
                        </label>

                        ${call.leftEstimate ? `
                            <input type="number" value="${call.estimateAmount || ''}" onchange="updateCall('${id}', 'estimateAmount', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border-2 border-orange-300 rounded-lg" placeholder="Estimate Amount ($)" />
                        ` : ''}

                        <div class="border-t-2 pt-3">
                            <p class="font-bold text-sm text-gray-700 mb-2">Performance Metrics</p>
                            <div class="grid grid-cols-2 gap-2">
                                ${['reviewCompleted','restorationLead','turnoverAttempted','selfGeneratedLead','rillaCompliant','maintenancePlanSold','upsellCompleted','jobComplete'].map(field => {
                                    const labels = {
                                        reviewCompleted: '✅ Review',
                                        restorationLead: '🏠 Restoration',
                                        turnoverAttempted: '🔄 Turnover',
                                        selfGeneratedLead: '🎯 Self-Gen',
                                        rillaCompliant: '🎙️ Rilla',
                                        maintenancePlanSold: '🛡️ Plan',
                                        upsellCompleted: '⬆️ Upsell',
                                        jobComplete: '✔️ Complete'
                                    };
                                    return `
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call[field] ? 'checked' : ''} onchange="updateCall('${id}', '${field}', this.checked)" class="w-4 h-4" />
                                            <span>${labels[field]}</span>
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.updateCall = function(callId, field, value) {
            const key = getDataKey(window.selectedDateObj);
            db.ref(`callLogs/${key}/${callId}/${field}`).set(value);
        };

        window.deleteCall = function(callId) {
            if (confirm('Delete this call?')) {
                const key = getDataKey(window.selectedDateObj);
                db.ref(`callLogs/${key}/${callId}`).remove();
            }
        };

        document.getElementById('addCallBtn').onclick = function() {
            const key = getDataKey(window.selectedDateObj);
            db.ref(`callLogs/${key}`).push().set({
                customerName: '', jobNumber: '', customerPhone: '',
                reviewCompleted: false, restorationLead: false,
                turnoverAttempted: false, turnoverAccepted: false,
                selfGeneratedLead: false, rillaCompliant: false,
                maintenancePlanSold: false, upsellCompleted: false,
                upsellAmount: 0, jobComplete: false, jobSold: false,
                amountSold: 0, moneyOwed: 0, followUpPlan: '',
                leftEstimate: false, estimateAmount: 0, jobCancelled: false,
                cancelReason: '', tradePlumbing: false, tradeHVAC: false,
                tradeElectrical: false, tradeCameras: false,
                timestamp: Date.now(), timeOfDay: new Date().getHours()
            });
        };

        document.getElementById('prevWeek').onclick = () => {
            currentDate = new Date(currentDate.getTime() - 7*24*60*60*1000);
            renderCalendar();
        };

        document.getElementById('nextWeek').onclick = () => {
            currentDate = new Date(currentDate.getTime() + 7*24*60*60*1000);
            renderCalendar();
        };

        renderCalendar();
    </script>
</body>
</html>
