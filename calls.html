<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Calls - Action Plumbing</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="p-4" style="max-width: 1280px; margin: 0 auto;">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-blue-900">📞 Log Calls</h1>
            <a href="index.html" class="px-4 py-2 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700">← Back to Dashboard</a>
        </div>

        <div id="personName" class="text-xl font-bold text-gray-700 mb-4"></div>

        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-6 rounded-lg shadow-lg border-2 border-blue-300 mb-6">
            <div class="flex items-center justify-between mb-6">
                <button id="prevWeek" class="p-3 bg-white rounded-full hover:bg-blue-100 shadow font-bold text-xl">←</button>
                <h2 id="weekRange" class="text-xl font-bold text-blue-900"></h2>
                <button id="nextWeek" class="p-3 bg-white rounded-full hover:bg-blue-100 shadow font-bold text-xl">→</button>
            </div>
            <div class="grid grid-cols-7 gap-3">
                <div class="text-center text-sm font-bold text-blue-700 mb-2">Mon</div>
                <div class="text-center text-sm font-bold text-blue-700 mb-2">Tue</div>
                <div class="text-center text-sm font-bold text-blue-700 mb-2">Wed</div>
                <div class="text-center text-sm font-bold text-blue-700 mb-2">Thu</div>
                <div class="text-center text-sm font-bold text-blue-700 mb-2">Fri</div>
                <div class="text-center text-sm font-bold text-blue-700 mb-2">Sat</div>
                <div class="text-center text-sm font-bold text-blue-700 mb-2">Sun</div>
                <div id="calendarDays"></div>
            </div>
        </div>

        <div id="callsSection" style="display: none;" class="bg-white p-6 rounded-lg shadow-lg">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-2xl font-bold text-blue-900">Call Logs</h3>
                <button id="addCallBtn" class="px-5 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold">+ Add Call</button>
            </div>
            <div id="callsList" class="space-y-4 max-h-[600px] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyD9POKxbl9hSt2FNtzdv3RPVnAb0wWsNbU",
            authDomain: "action-sales-tracker.firebaseapp.com",
            databaseURL: "https://action-sales-tracker.firebaseio.com",
            projectId: "action-sales-tracker",
            storageBucket: "action-sales-tracker.firebasestorage.app",
            messagingSenderId: "686455834332",
            appId: "1:686455834332:web:84e9b843f912522bbdd619"
        });

        const db = firebase.database();
        const selected = localStorage.getItem('selectedPerson');
        let currentDate = new Date();
        let selectedDate = null;
        let people = [];

        if (!selected) {
            window.location.href = 'index.html';
        }

        db.ref('salespeople').once('value', snapshot => {
            const data = snapshot.val();
            people = data ? Object.keys(data).map(k => ({ id: k, name: data[k].name })) : [];
            const person = people.find(p => p.id === selected);
            if (person) {
                document.getElementById('personName').textContent = `Logging calls for: ${person.name}`;
            }
        });

        const dk = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const dataKey = d => `${selected}_${dk(d)}`;

        function getWeek(date) {
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(date);
            monday.setDate(diff);
            const week = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                week.push(d);
            }
            return week;
        }

        function renderCalendar() {
            const week = getWeek(currentDate);
            document.getElementById('weekRange').textContent = 
                `${week[0].toLocaleDateString('en-US', {month:'short',day:'numeric'})} - ${week[6].toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'})}`;

            const container = document.getElementById('calendarDays');
            container.innerHTML = '';
            
            week.forEach(d => {
                db.ref(`callLogs/${dataKey(d)}`).once('value', snapshot => {
                    const calls = snapshot.val();
                    const callsArray = calls ? Object.values(calls) : [];
                    const sold = callsArray.filter(c => c.jobSold);
                    const total = callsArray.reduce((sum, c) => sum + (parseFloat(c.amountSold) || 0), 0);
                    const dateKey = dk(d);
                    const isToday = dk(new Date()) === dateKey;
                    const isSelected = selectedDate === dateKey;

                    const dayDiv = document.createElement('button');
                    dayDiv.className = `p-4 rounded-xl border-2 transition-all ${
                        isSelected ? 'border-blue-600 bg-blue-100 shadow-lg' :
                        callsArray.length > 0 ? 'border-green-400 bg-green-50 hover:shadow-md' :
                        isToday ? 'border-blue-300 bg-white shadow-md' :
                        'border-gray-200 bg-white hover:border-gray-300'
                    }`;
                    dayDiv.onclick = () => {
                        selectedDate = isSelected ? null : dateKey;
                        renderCalendar();
                        if (selectedDate) renderCalls(d);
                        else document.getElementById('callsSection').style.display = 'none';
                    };

                    dayDiv.innerHTML = `
                        <div class="text-xl font-bold">${d.getDate()}</div>
                        ${callsArray.length > 0 ? `
                            <div class="mt-2">
                                <div class="text-xs font-bold text-green-700">${sold.length} sold</div>
                                <div class="text-xs font-bold text-green-700">$${total.toLocaleString()}</div>
                            </div>
                        ` : ''}
                    `;
                    container.appendChild(dayDiv);
                });
            });
        }

        function renderCalls(date) {
            document.getElementById('callsSection').style.display = 'block';
            const key = dataKey(date);

            db.ref(`callLogs/${key}`).on('value', snapshot => {
                const calls = snapshot.val();
                const callsArray = calls ? Object.keys(calls).map(id => ({ id, ...calls[id] })) : [];

                const container = document.getElementById('callsList');
                if (callsArray.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-8">No calls logged for this day</p>';
                } else {
                    container.innerHTML = callsArray.map(call => `
                        <div class="p-4 bg-gray-50 rounded-lg border-2 border-gray-200">
                            <div class="flex justify-between mb-3">
                                <span class="text-sm font-bold text-gray-600">Call Entry</span>
                                <button onclick="deleteCall('${call.id}')" class="text-red-600 font-bold hover:text-red-800">🗑️ Delete</button>
                            </div>
                            <div class="space-y-3">
                                <input type="text" value="${call.customerName || ''}" onchange="updateCall('${call.id}', 'customerName', this.value)" class="w-full px-3 py-2 border-2 rounded-lg" placeholder="Customer Name" />
                                <input type="text" value="${call.jobNumber || ''}" onchange="updateCall('${call.id}', 'jobNumber', this.value)" class="w-full px-3 py-2 border-2 rounded-lg" placeholder="Job Number" />
                                <input type="tel" value="${call.customerPhone || ''}" onchange="updateCall('${call.id}', 'customerPhone', this.value)" class="w-full px-3 py-2 border-2 rounded-lg" placeholder="Customer Phone" />
                                
                                <label class="flex items-center gap-3 p-3 bg-white rounded-lg border-2 border-gray-300 cursor-pointer hover:border-green-400">
                                    <input type="checkbox" ${call.jobSold ? 'checked' : ''} onchange="updateCall('${call.id}', 'jobSold', this.checked)" class="w-5 h-5" />
                                    <span class="font-bold text-lg">💰 Job Sold</span>
                                </label>
                                
                                ${call.jobSold ? `
                                    <div class="space-y-2">
                                        <input type="number" value="${call.amountSold || ''}" onchange="updateCall('${call.id}', 'amountSold', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border-2 border-green-300 rounded-lg text-lg font-bold" placeholder="Amount Sold ($)" />
                                        <input type="number" value="${call.moneyOwed || ''}" onchange="updateCall('${call.id}', 'moneyOwed', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border-2 border-orange-300 rounded-lg font-bold" placeholder="Money Owed ($)" />
                                    </div>
                                ` : ''}

                                <label class="flex items-center gap-3 p-3 bg-white rounded-lg border-2 border-gray-300 cursor-pointer hover:border-red-400">
                                    <input type="checkbox" ${call.jobCancelled ? 'checked' : ''} onchange="updateCall('${call.id}', 'jobCancelled', this.checked)" class="w-5 h-5" />
                                    <span class="font-bold text-lg">❌ Job Cancelled</span>
                                </label>
                                
                                ${call.jobCancelled ? `
                                    <textarea onchange="updateCall('${call.id}', 'cancelReason', this.value)" class="w-full px-3 py-2 border-2 border-red-300 rounded-lg" placeholder="Reason for cancellation..." rows="3">${call.cancelReason || ''}</textarea>
                                ` : ''}

                                <label class="flex items-center gap-3 p-3 bg-white rounded-lg border-2 border-gray-300 cursor-pointer hover:border-orange-400">
                                    <input type="checkbox" ${call.leftEstimate ? 'checked' : ''} onchange="updateCall('${call.id}', 'leftEstimate', this.checked)" class="w-5 h-5" />
                                    <span class="font-bold">📋 Left Estimate</span>
                                </label>
                                
                                ${call.leftEstimate ? `
                                    <input type="number" value="${call.estimateAmount || ''}" onchange="updateCall('${call.id}', 'estimateAmount', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border-2 border-orange-300 rounded-lg" placeholder="Estimate Amount ($)" />
                                ` : ''}

                                <div class="border-t-2 pt-3 mt-3">
                                    <p class="font-bold text-sm text-gray-700 mb-2">Trade Type</p>
                                    <div class="grid grid-cols-2 gap-2">
                                        <label class="flex items-center gap-2 p-2 bg-blue-50 rounded border border-blue-300 cursor-pointer">
                                            <input type="checkbox" ${call.tradePlumbing ? 'checked' : ''} onchange="updateCall('${call.id}', 'tradePlumbing', this.checked)" class="w-4 h-4" />
                                            <span class="text-sm font-bold text-blue-700">🔧 Plumbing</span>
                                        </label>
                                        <label class="flex items-center gap-2 p-2 bg-yellow-50 rounded border border-yellow-300 cursor-pointer">
                                            <input type="checkbox" ${call.tradeElectrical ? 'checked' : ''} onchange="updateCall('${call.id}', 'tradeElectrical', this.checked)" class="w-4 h-4" />
                                            <span class="text-sm font-bold text-yellow-700">⚡ Electrical</span>
                                        </label>
                                        <label class="flex items-center gap-2 p-2 bg-red-50 rounded border border-red-300 cursor-pointer">
                                            <input type="checkbox" ${call.tradeHVAC ? 'checked' : ''} onchange="updateCall('${call.id}', 'tradeHVAC', this.checked)" class="w-4 h-4" />
                                            <span class="text-sm font-bold text-red-700">🌡️ HVAC</span>
                                        </label>
                                        <label class="flex items-center gap-2 p-2 bg-purple-50 rounded border border-purple-300 cursor-pointer">
                                            <input type="checkbox" ${call.tradeCameras ? 'checked' : ''} onchange="updateCall('${call.id}', 'tradeCameras', this.checked)" class="w-4 h-4" />
                                            <span class="text-sm font-bold text-purple-700">📹 Cameras</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="border-t-2 pt-3 mt-3">
                                    <p class="font-bold text-sm text-gray-700 mb-2">Performance Metrics</p>
                                    <div class="grid grid-cols-2 gap-2">
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call.reviewCompleted ? 'checked' : ''} onchange="updateCall('${call.id}', 'reviewCompleted', this.checked)" class="w-4 h-4" />
                                            <span>✅ Review</span>
                                        </label>
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call.restorationLead ? 'checked' : ''} onchange="updateCall('${call.id}', 'restorationLead', this.checked)" class="w-4 h-4" />
                                            <span>🏠 Restoration</span>
                                        </label>
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call.turnoverAttempted ? 'checked' : ''} onchange="updateCall('${call.id}', 'turnoverAttempted', this.checked)" class="w-4 h-4" />
                                            <span>🔄 Turnover Attempt</span>
                                        </label>
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call.turnoverAccepted ? 'checked' : ''} onchange="updateCall('${call.id}', 'turnoverAccepted', this.checked)" ${!call.turnoverAttempted ? 'disabled' : ''} class="w-4 h-4" />
                                            <span>✔️ Turnover Accept</span>
                                        </label>
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call.selfGeneratedLead ? 'checked' : ''} onchange="updateCall('${call.id}', 'selfGeneratedLead', this.checked)" class="w-4 h-4" />
                                            <span>🎯 Self-Gen</span>
                                        </label>
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call.rillaCompliant ? 'checked' : ''} onchange="updateCall('${call.id}', 'rillaCompliant', this.checked)" class="w-4 h-4" />
                                            <span>🎙️ Rilla</span>
                                        </label>
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call.maintenancePlanSold ? 'checked' : ''} onchange="updateCall('${call.id}', 'maintenancePlanSold', this.checked)" class="w-4 h-4" />
                                            <span>🛡️ Plan</span>
                                        </label>
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call.upsellCompleted ? 'checked' : ''} onchange="updateCall('${call.id}', 'upsellCompleted', this.checked)" class="w-4 h-4" />
                                            <span>⬆️ Upsell</span>
                                        </label>
                                        <label class="flex items-center gap-2 text-sm cursor-pointer">
                                            <input type="checkbox" ${call.jobComplete ? 'checked' : ''} onchange="updateCall('${call.id}', 'jobComplete', this.checked)" class="w-4 h-4" />
                                            <span>✔️ Complete</span>
                                        </label>
                                    </div>
                                    ${call.upsellCompleted ? `
                                        <input type="number" value="${call.upsellAmount || ''}" onchange="updateCall('${call.id}', 'upsellAmount', parseFloat(this.value) || 0)" class="w-full px-3 py-2 border-2 rounded-lg mt-2" placeholder="Upsell Amount ($)" />
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            });

            document.getElementById('addCallBtn').onclick = () => {
                db.ref(`callLogs/${key}`).push().set({
                    customerName: '', jobNumber: '', customerPhone: '',
                    reviewCompleted: false, restorationLead: false,
                    turnoverAttempted: false, turnoverAccepted: false,
                    selfGeneratedLead: false, rillaCompliant: false,
                    maintenancePlanSold: false, upsellCompleted: false,
                    upsellAmount: 0, jobComplete: false, jobSold: false,
                    amountSold: 0, moneyOwed: 0, followUpPlan: '',
                    leftEstimate: false, estimateAmount: 0,
                    jobCancelled: false, cancelReason: '',
                    tradePlumbing: false, tradeHVAC: false,
                    tradeElectrical: false, tradeCameras: false,
                    timestamp: Date.now(), timeOfDay: new Date().getHours()
                });
            };
        }

        function updateCall(callId, field, value) {
            const key = dataKey(getWeek(currentDate).find(d => dk(d) === selectedDate));
            db.ref(`callLogs/${key}/${callId}/${field}`).set(value);
        }

        function deleteCall(callId) {
            if (confirm('Delete this call?')) {
                const key = dataKey(getWeek(currentDate).find(d => dk(d) === selectedDate));
                db.ref(`callLogs/${key}/${callId}`).remove();
            }
        }

        document.getElementById('prevWeek').onclick = () => {
            currentDate = new Date(currentDate.getTime() - 7*24*60*60*1000);
            selectedDate = null;
            document.getElementById('callsSection').style.display = 'none';
            renderCalendar();
        };

        document.getElementById('nextWeek').onclick = () => {
            currentDate = new Date(currentDate.getTime() + 7*24*60*60*1000);
            selectedDate = null;
            document.getElementById('callsSection').style.display = 'none';
            renderCalendar();
        };

        renderCalendar();
    </script>
</body>
</html>
