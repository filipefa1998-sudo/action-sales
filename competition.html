<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Competition - Action Plumbing</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="p-4" style="max-width: 1400px; margin: 0 auto;">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-purple-900">🏆 Monthly Competition</h1>
            <a href="index.html" class="px-4 py-2 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700">← Back to Dashboard</a>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
            <div class="flex items-center justify-between mb-4">
                <button id="prevMonth" class="px-4 py-2 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700">← Previous</button>
                <h2 id="monthYear" class="text-2xl font-bold text-purple-900"></h2>
                <button id="nextMonth" class="px-4 py-2 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700">Next →</button>
            </div>

            <!-- Setup Teams Section -->
            <div class="mb-6 p-4 bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg border-2 border-purple-300">
                <h3 class="text-xl font-bold text-purple-900 mb-4">🎯 Setup Teams for This Month</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="teamSetup">
                    <!-- Team 1 -->
                    <div class="bg-white p-4 rounded-lg border-2 border-blue-300">
                        <h4 class="font-bold text-blue-900 mb-3">Team 1</h4>
                        <label class="text-sm font-bold text-gray-700 block mb-1">Captain:</label>
                        <select id="captain1" class="w-full px-3 py-2 border-2 border-blue-300 rounded-lg mb-3 font-semibold">
                            <option value="">Select Captain...</option>
                        </select>
                        <label class="text-sm font-bold text-gray-700 block mb-1">Teammates:</label>
                        <div id="teammates1" class="space-y-2"></div>
                        <button onclick="addTeammate(1)" class="mt-2 px-3 py-1 bg-blue-100 text-blue-700 rounded text-sm font-bold hover:bg-blue-200">+ Add Teammate</button>
                    </div>

                    <!-- Team 2 -->
                    <div class="bg-white p-4 rounded-lg border-2 border-green-300">
                        <h4 class="font-bold text-green-900 mb-3">Team 2</h4>
                        <label class="text-sm font-bold text-gray-700 block mb-1">Captain:</label>
                        <select id="captain2" class="w-full px-3 py-2 border-2 border-green-300 rounded-lg mb-3 font-semibold">
                            <option value="">Select Captain...</option>
                        </select>
                        <label class="text-sm font-bold text-gray-700 block mb-1">Teammates:</label>
                        <div id="teammates2" class="space-y-2"></div>
                        <button onclick="addTeammate(2)" class="mt-2 px-3 py-1 bg-green-100 text-green-700 rounded text-sm font-bold hover:bg-green-200">+ Add Teammate</button>
                    </div>

                    <!-- Team 3 -->
                    <div class="bg-white p-4 rounded-lg border-2 border-orange-300">
                        <h4 class="font-bold text-orange-900 mb-3">Team 3</h4>
                        <label class="text-sm font-bold text-gray-700 block mb-1">Captain:</label>
                        <select id="captain3" class="w-full px-3 py-2 border-2 border-orange-300 rounded-lg mb-3 font-semibold">
                            <option value="">Select Captain...</option>
                        </select>
                        <label class="text-sm font-bold text-gray-700 block mb-1">Teammates:</label>
                        <div id="teammates3" class="space-y-2"></div>
                        <button onclick="addTeammate(3)" class="mt-2 px-3 py-1 bg-orange-100 text-orange-700 rounded text-sm font-bold hover:bg-orange-200">+ Add Teammate</button>
                    </div>
                </div>

                <button id="saveTeams" class="mt-4 w-full px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-bold text-lg hover:from-purple-700 hover:to-pink-700">
                    💾 Save Teams for This Month
                </button>
            </div>

            <!-- Competition Leaderboard -->
            <div id="leaderboard" class="space-y-4"></div>

            <!-- Detailed Stats -->
            <div id="detailedStats" class="mt-6"></div>
        </div>
    </div>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyD9POKxbl9hSt2FNtzdv3RPVnAb0wWsNbU",
            authDomain: "action-sales-tracker.firebaseapp.com",
            databaseURL: "https://action-sales-tracker-default-rtdb.firebaseio.com",
            projectId: "action-sales-tracker",
            storageBucket: "action-sales-tracker.firebasestorage.app",
            messagingSenderId: "686455834332",
            appId: "1:686455834332:web:84e9b843f912522bbdd619"
        });

        const db = firebase.database();
        let currentDate = new Date();
        let people = [];
        let logs = {};
        let currentMonthKey = '';
        let teamConfig = { team1: [], team2: [], team3: [] };

        const dk = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const mk = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

        db.ref('salespeople').on('value', snapshot => {
            const data = snapshot.val();
            people = data ? Object.keys(data).map(k => ({ id: k, name: data[k].name })) : [];
            populateCaptainDropdowns();
            loadTeams();
        });

        db.ref('callLogs').on('value', snapshot => {
            logs = snapshot.val() || {};
            renderStats();
        });

        function populateCaptainDropdowns() {
            [1, 2, 3].forEach(teamNum => {
                const select = document.getElementById(`captain${teamNum}`);
                select.innerHTML = '<option value="">Select Captain...</option>' + 
                    people.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            });
        }

        function addTeammate(teamNum) {
            const container = document.getElementById(`teammates${teamNum}`);
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = 'flex gap-2';
            div.innerHTML = `
                <select class="teammate-select flex-1 px-3 py-2 border-2 rounded-lg text-sm" data-team="${teamNum}">
                    <option value="">Select teammate...</option>
                    ${people.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                </select>
                <button onclick="this.parentElement.remove()" class="px-3 py-1 bg-red-100 text-red-700 rounded text-sm font-bold hover:bg-red-200">×</button>
            `;
            container.appendChild(div);
        }

        function loadTeams() {
            currentMonthKey = mk(currentDate);
            db.ref(`monthlyCompetition/${currentMonthKey}`).once('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    // Load Team 1
                    if (data.team1) {
                        document.getElementById('captain1').value = data.team1.captain || '';
                        document.getElementById('teammates1').innerHTML = '';
                        (data.team1.members || []).forEach(() => addTeammate(1));
                        const selects1 = document.querySelectorAll('#teammates1 .teammate-select');
                        (data.team1.members || []).forEach((id, i) => {
                            if (selects1[i]) selects1[i].value = id;
                        });
                    }
                    // Load Team 2
                    if (data.team2) {
                        document.getElementById('captain2').value = data.team2.captain || '';
                        document.getElementById('teammates2').innerHTML = '';
                        (data.team2.members || []).forEach(() => addTeammate(2));
                        const selects2 = document.querySelectorAll('#teammates2 .teammate-select');
                        (data.team2.members || []).forEach((id, i) => {
                            if (selects2[i]) selects2[i].value = id;
                        });
                    }
                    // Load Team 3
                    if (data.team3) {
                        document.getElementById('captain3').value = data.team3.captain || '';
                        document.getElementById('teammates3').innerHTML = '';
                        (data.team3.members || []).forEach(() => addTeammate(3));
                        const selects3 = document.querySelectorAll('#teammates3 .teammate-select');
                        (data.team3.members || []).forEach((id, i) => {
                            if (selects3[i]) selects3[i].value = id;
                        });
                    }
                    teamConfig = data;
                }
                renderStats();
            });
        }

        document.getElementById('saveTeams').onclick = () => {
            const config = {
                team1: {
                    captain: document.getElementById('captain1').value,
                    members: Array.from(document.querySelectorAll('#teammates1 .teammate-select'))
                        .map(s => s.value).filter(v => v)
                },
                team2: {
                    captain: document.getElementById('captain2').value,
                    members: Array.from(document.querySelectorAll('#teammates2 .teammate-select'))
                        .map(s => s.value).filter(v => v)
                },
                team3: {
                    captain: document.getElementById('captain3').value,
                    members: Array.from(document.querySelectorAll('#teammates3 .teammate-select'))
                        .map(s => s.value).filter(v => v)
                }
            };

            db.ref(`monthlyCompetition/${currentMonthKey}`).set(config);
            teamConfig = config;
            alert('Teams saved for ' + currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }));
            renderStats();
        };

        function getMDates(date) {
            const y = date.getFullYear();
            const m = date.getMonth();
            const arr = [];
            const last = new Date(y, m+1, 0).getDate();
            for (let day = 1; day <= last; day++) arr.push(new Date(y, m, day));
            return arr;
        }

        function getCalls(pid, d) {
            const key = `${pid}_${dk(d)}`;
            const l = logs[key];
            if (!l) return [];
            return Object.values(l);
        }

        function calcTeamStats(memberIds, dates) {
            const stats = {
                revenue: 0,
                reviews: 0,
                totalCalls: 0,
                callsSold: 0,
                turnovers: 0
            };

            memberIds.forEach(pid => {
                dates.forEach(d => {
                    const calls = getCalls(pid, d);
                    calls.forEach(c => {
                        stats.totalCalls++;
                        if (c.jobSold) {
                            stats.callsSold++;
                            stats.revenue += parseFloat(c.amountSold) || 0;
                        }
                        if (c.reviewCompleted) stats.reviews++;
                        if (c.turnoverAccepted) stats.turnovers++;
                    });
                });
            });

            stats.closePercent = stats.totalCalls > 0 ? (stats.callsSold / stats.totalCalls * 100) : 0;
            return stats;
        }

        function renderStats() {
            document.getElementById('monthYear').textContent = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const dates = getMDates(currentDate);
            
            const teams = [
                {
                    num: 1,
                    color: 'blue',
                    captain: teamConfig.team1?.captain,
                    members: [teamConfig.team1?.captain, ...(teamConfig.team1?.members || [])].filter(Boolean)
                },
                {
                    num: 2,
                    color: 'green',
                    captain: teamConfig.team2?.captain,
                    members: [teamConfig.team2?.captain, ...(teamConfig.team2?.members || [])].filter(Boolean)
                },
                {
                    num: 3,
                    color: 'orange',
                    captain: teamConfig.team3?.captain,
                    members: [teamConfig.team3?.captain, ...(teamConfig.team3?.members || [])].filter(Boolean)
                }
            ];

            // Calculate stats for each team
            const teamStats = teams.map(team => {
                const stats = calcTeamStats(team.members, dates);
                const captainName = people.find(p => p.id === team.captain)?.name || 'No Captain';
                return { ...team, ...stats, captainName, points: 0 };
            }).filter(t => t.members.length > 0);

            if (teamStats.length === 0) {
                document.getElementById('leaderboard').innerHTML = '<p class="text-center text-gray-500 py-8">Setup teams above to start the competition!</p>';
                document.getElementById('detailedStats').innerHTML = '';
                return;
            }

            // Award points for each category
            const categories = ['revenue', 'reviews', 'closePercent', 'turnovers'];
            categories.forEach(cat => {
                const sorted = [...teamStats].sort((a, b) => b[cat] - a[cat]);
                const winner = sorted[0];
                const winnerTeam = teamStats.find(t => t.num === winner.num);
                if (winnerTeam) winnerTeam.points++;
            });

            // Sort by points
            teamStats.sort((a, b) => b.points - a.points);
            const leader = teamStats[0];

            // Render Leaderboard
            document.getElementById('leaderboard').innerHTML = `
                <h3 class="text-2xl font-bold text-purple-900 mb-4">🏆 Current Standings</h3>
                ${teamStats.map((team, idx) => {
                    const isLeader = idx === 0;
                    return `
                        <div class="p-6 bg-gradient-to-r from-${team.color}-50 to-${team.color}-100 rounded-xl border-2 border-${team.color}-400 ${isLeader ? 'shadow-2xl' : 'shadow-lg'}">
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center gap-4">
                                    <div class="w-16 h-16 bg-${team.color}-600 text-white rounded-xl flex items-center justify-center text-3xl font-black">
                                        ${isLeader ? '👑' : `#${idx + 1}`}
                                    </div>
                                    <div>
                                        <h4 class="text-2xl font-black text-${team.color}-900">Team ${team.captainName}</h4>
                                        <p class="text-sm text-gray-600">${team.members.length} members</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-4xl font-black text-${team.color}-900">${team.points}</p>
                                    <p class="text-sm font-bold text-gray-600">POINTS</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-4 gap-4">
                                <div class="bg-white p-3 rounded-lg">
                                    <p class="text-xs font-bold text-gray-600">💰 Revenue</p>
                                    <p class="text-xl font-bold text-${team.color}-900">$${team.revenue.toLocaleString()}</p>
                                </div>
                                <div class="bg-white p-3 rounded-lg">
                                    <p class="text-xs font-bold text-gray-600">⭐ Reviews</p>
                                    <p class="text-xl font-bold text-${team.color}-900">${team.reviews}</p>
                                </div>
                                <div class="bg-white p-3 rounded-lg">
                                    <p class="text-xs font-bold text-gray-600">📊 Close %</p>
                                    <p class="text-xl font-bold text-${team.color}-900">${team.closePercent.toFixed(1)}%</p>
                                </div>
                                <div class="bg-white p-3 rounded-lg">
                                    <p class="text-xs font-bold text-gray-600">🔄 Turnovers</p>
                                    <p class="text-xl font-bold text-${team.color}-900">${team.turnovers}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')}
            `;

            // Detailed Stats
            document.getElementById('detailedStats').innerHTML = `
                <h3 class="text-2xl font-bold text-purple-900 mb-4">📊 Category Winners</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    ${categories.map(cat => {
                        const sorted = [...teamStats].sort((a, b) => b[cat] - a[cat]);
                        const winner = sorted[0];
                        const labels = {
                            revenue: '💰 Revenue',
                            reviews: '⭐ Reviews',
                            closePercent: '📊 Close %',
                            turnovers: '🔄 Turnovers'
                        };
                        const values = {
                            revenue: `$${winner.revenue.toLocaleString()}`,
                            reviews: winner.reviews,
                            closePercent: `${winner.closePercent.toFixed(1)}%`,
                            turnovers: winner.turnovers
                        };
                        return `
                            <div class="p-4 bg-gradient-to-br from-${winner.color}-50 to-${winner.color}-100 rounded-lg border-2 border-${winner.color}-400">
                                <p class="text-sm font-bold text-gray-700 mb-2">${labels[cat]}</p>
                                <p class="text-2xl font-black text-${winner.color}-900 mb-1">${values[cat]}</p>
                                <p class="text-xs font-bold text-${winner.color}-700">🏆 Team ${winner.captainName}</p>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        document.getElementById('prevMonth').onclick = () => {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
            loadTeams();
        };

        document.getElementById('nextMonth').onclick = () => {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
            loadTeams();
        };

        loadTeams();
    </script>
</body>
</html>
